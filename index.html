<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique Diamants Free Fire</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { color: #ff6600; }
        input, select, button { width: 90%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; }
        input, select { background: #333; color: white; }
        button { background: #ff6600; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #e05500; }
        .pack-list { display: flex; flex-wrap: wrap; justify-content: space-around; margin: 20px 0; }
        .pack { background: #2a2a2a; border: 2px solid #ff6600; padding: 15px; border-radius: 8px; width: 40%; margin: 10px 0; cursor: pointer; }
        .pack.selected { background: #ff6600; color: black; }
    </style>
</head>
<body>

<div class="container">
    <h1>💎 Free Fire Diamond Store</h1>
    <p>Recharge instantanée par UID du joueur</p>

    <input type="text" id="playerID" placeholder="Entrez votre UID Free Fire (ex: 123456789)" required>

    <h3>Choisissez votre pack :</h3>
    <div class="pack-list">
        <div class="pack" onclick="selectPack(this, '100 Diamants', '1.00')">💎 100 Diamonds<br><b>1.00 USD</b></div>
        <div class="pack" onclick="selectPack(this, '310 Diamants', '3.00')">💎 310 Diamonds<br><b>3.00 USD</b></div>
        <div class="pack" onclick="selectPack(this, '520 Diamants', '5.00')">💎 520 Diamonds<br><b>5.00 USD</b></div>
        <div class="pack" onclick="selectPack(this, '1060 Diamants', '10.00')">💎 1060 Diamonds<br><b>10.00 USD</b></div>
    </div>

    <button onclick="redirectToPayment()">⚡ Passer à la caisse</button>
</div>

<script>
    let selectedPackName = "";
    let selectedPackPrice = "";

    function selectPack(element, name, price) {
        let packs = document.querySelectorAll('.pack');
        packs.forEach(p => p.classList.remove('selected'));
        element.classList.add('selected');
        selectedPackName = name;
        selectedPackPrice = price;
    }

    function redirectToPayment() {
        const uid = document.getElementById('playerID').value;
        if (!uid) { alert("Veuillez entrer votre UID Free Fire !"); return; }
        if (!selectedPackName) { alert("Veuillez choisir un pack de diamants !"); return; }

        // REMPLACEZ CE LIEN PAR VOTRE LIEN DE PAIEMENT (PayPal, Stripe, ou WhatsApp)
        const message = `Bonjour, je souhaite acheter le pack ${selectedPackName} (${selectedPackPrice} USD) pour l'UID Free Fire : ${uid}`;
        const whatsappUrl = `https://wa.me{encodeURIComponent(message)}`;
        
        window.location.href = whatsappUrl;
    }
</script>

</body>
</html>
