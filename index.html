<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMLS Store - Free Fire Zone</title>
    <style>
        /* Thème Gamer Cyberpunk / Orange Électrique */
        :root {
            --bg-dark: #08090c;
            --panel-bg: #11141d;
            --input-bg: #181c27;
            --accent-glow: #ff9800;
            --neon-green: #00e676;
            --text-main: #ffffff;
            --text-gray: #7e8494;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* En-tête Gamer */
        header {
            background-color: var(--panel-bg);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1e2333;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo span {
            color: var(--accent-glow);
            text-shadow: 0 0 10px rgba(255, 152, 0, 0.6);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .hero-banner {
            background: linear-gradient(135px, #1c1f2e 0%, #08090c 100%);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            margin-bottom: 40px;
            border: 1px solid #252b3d;
            box-shadow: inset 0 0 30px rgba(255,152,0,0.05);
        }

        .hero-banner h1 {
            font-size: 32px;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        /* --- GRILLE DES OFFRES DE DIAMANTS --- */
        .shop-section {
            display: block; /* Visible par défaut */
        }

        .grid-diamonds {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .diamond-card {
            background-color: var(--panel-bg);
            border: 1px solid #202636;
            border-radius: 14px;
            padding: 25px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .diamond-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-glow);
            box-shadow: 0 10px 25px rgba(255, 152, 0, 0.15);
        }

        .diamond-icon {
            font-size: 45px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px #00d2ff);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .diamond-card h3 {
            font-size: 20px;
            margin: 5px 0;
            text-transform: uppercase;
        }

        .diamond-card .price {
            font-size: 22px;
            font-weight: 800;
            color: var(--neon-green);
            margin: 15px 0;
            text-shadow: 0 0 5px rgba(0, 230, 118, 0.2);
        }

        /* 🔥 BOUTON ANIMÉ ET COOL (STYLE GAMER) 🔥 */
        .btn-gamer {
            background: linear-gradient(90px, #ff9800, #ff5722);
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.4);
        }

        .btn-gamer:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(255, 152, 0, 0.7);
            color: #fff;
        }

        /* Effet de brillance qui traverse le bouton */
        .btn-gamer::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 30%;
            height: 200%;
            background: rgba(255, 255, 255, 0.4);
            transform: rotate(25deg);
            transition: none;
        }

        .btn-gamer:hover::after {
            left: 140%;
            transition: all 0.6s ease-in-out;
        }

        /* --- NOUVEAU MENU D'ACHAT (CAISSE) --- */
        .checkout-section {
            display: none; /* Caché au début, activé par le clic */
            background-color: var(--panel-bg);
            border: 2px solid #202636;
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }

        .checkout-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #252b3d;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .btn-back {
            background: none;
            border: 1px solid var(--text-gray);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-back:hover {
            border-color: var(--accent-glow);
            color: var(--accent-glow);
        }

        .item-summary {
            background-color: var(--bg-dark);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-glow);
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-gamer {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-block label {
            font-size: 13px;
            text-transform: uppercase;
            color: var(--text-gray);
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .input-block input {
            background-color: var(--input-bg);
            border: 1px solid #252b3d;
            padding: 14px;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        .input-block input:focus {
            border-color: var(--accent-glow);
            outline: none;
            box-shadow: 0 0 10px rgba(255,152,0,0.1);
        }

        .btn-pay-final {
            background: linear-gradient(90px, #00e676, #00b0ff);
            color: black;
            font-weight: 900;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
            margin-top: 10px;
        }

        .btn-pay-final:hover {
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.6);
            transform: translateY(-2px);
        }

        /* --- SCRIPT IA EN BAS À DROITE --- */
        .ai-chat-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #00b0ff;
            color: black;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 176, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
