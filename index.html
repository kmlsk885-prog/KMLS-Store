<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚡ Diamant Shop – Free Fire</title>
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
    }
    body {
      background: linear-gradient(145deg, #0b0c1a 0%, #1a1b3a 100%);
      color: #fff;
      min-height: 100vh;
      padding: 1rem;
      position: relative;
      overflow-x: hidden;
    }
    /* ===== PARTICULES ANIME (fond) ===== */
    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
    }
    /* ===== HEADER ===== */
    .anime-header {
      text-align: center;
      padding: 2.5rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      border-radius: 30px;
      margin-bottom: 2rem;
      border: 1px solid rgba(255, 110, 199, 0.4);
      box-shadow: 0 0 50px rgba(255, 110, 199, 0.2);
      animation: glowPulse 3s infinite alternate;
    }
    @keyframes glowPulse {
      0% { box-shadow: 0 0 20px #ff6ec7; border-color: #ff6ec7; }
      100% { box-shadow: 0 0 60px #ff3c9e; border-color: #ff3c9e; }
    }
    .anime-header h1 {
      font-size: 3.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff6ec7, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
      letter-spacing: 2px;
    }
    .anime-header p {
      font-size: 1.2rem;
      opacity: 0.9;
      margin-top: 0.5rem;
      color: #ddd;
    }
    .anime-header .sub {
      font-size: 0.9rem;
      background: rgba(255, 215, 0, 0.2);
      display: inline-block;
      padding: 0.3rem 1.2rem;
      border-radius: 30px;
      margin-top: 0.5rem;
      border: 1px solid #ffd700;
    }
    /* ===== PACKS ===== */
    .packs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      margin: 2rem 0;
    }
    .pack {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 1.8rem 1.2rem;
      width: 210px;
      text-align: center;
      border: 1px solid rgba(255, 110, 199, 0.5);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }
    .pack:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 0 40px rgba(255, 110, 199, 0.6);
      border-color: #ffd700;
    }
    .pack .diamond-icon {
      font-size: 3.5rem;
      display: block;
      margin-bottom: 0.5rem;
    }
    .pack h3 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
    }
    .pack .price {
      font-size: 2rem;
      font-weight: 700;
      color: #ffd700;
      margin: 0.5rem 0;
    }
    .pack .price small {
      font-size: 1rem;
      color: #aaa;
    }
    .pack .bonus {
      font-size: 0.8rem;
      background: rgba(0, 212, 255, 0.2);
      padding: 0.2rem 1rem;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 1rem;
      border: 1px solid #00d4ff;
      color: #00d4ff;
    }
    .buy-btn {
      background: linear-gradient(135deg, #ff6ec7, #ff3c9e);
      border: none;
      padding: 0.7rem 1.8rem;
      border-radius: 40px;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(255, 110, 199, 0.4);
      letter-spacing: 1px;
    }
    .buy-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(255, 110, 199, 0.7);
    }
    /* ===== PANIER ===== */
    .cart {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 1.8rem;
      margin: 2rem auto;
      max-width: 650px;
      border: 1px solid #00d4ff;
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
    }
    .cart h2 {
      color: #00d4ff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.8rem;
    }
    #cart-items {
      list-style: none;
      padding: 0;
      margin: 1rem 0;
      max-height: 200px;
      overflow-y: auto;
    }
    #cart-items li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    #cart-items .remove {
      background: none;
      border: none;
      color: #ff6ec7;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.2s;
    }
    #cart-items .remove:hover { transform: scale(1.3); }
    .cart-total {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: right;
      margin-top: 0.5rem;
      border-top: 2px solid rgba(255, 215, 0, 0.3);
      padding-top: 0.5rem;
    }
    .cart-total span { color: #ffd700; }
    #checkout-btn {
      background: linear-gradient(135deg, #00d4ff, #0088cc);
      border: none;
      padding: 0.8rem 2.5rem;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
      cursor: pointer;
      width: 100%;
      transition: 0.3s;
      margin-top: 1rem;
      box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
    }
    #checkout-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 30px rgba(0, 212, 255, 0.5);
    }
    #payment-message {
      background: #4caf50;
      color: #fff;
      padding: 0.8rem;
      border-radius: 12px;
      margin-top: 1rem;
      display: none;
      text-align: center;
      font-weight: 600;
    }
    /* ===== CHATBOT ===== */
    .chatbot {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
    }
    #chat-toggle {
      background: linear-gradient(135deg, #ff6ec7, #ff3c9e);
      border: none;
      padding: 14px 22px;
      border-radius: 50px;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255, 110, 199, 0.5);
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #chat-toggle:hover { transform: scale(1.05); }
    #chat-window {
      background: rgba(26, 27, 58, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      width: 320px;
      height: 420px;
      display: none;
      flex-direction: column;
      padding: 15px;
      border: 1px solid #ff6ec7;
      margin-bottom: 12px;
      box-shadow: 0 0 40px rgba(255, 110, 199, 0.3);
    }
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
      padding-right: 5px;
    }
    #chat-messages .user {
      align-self: flex-end;
      background: #00d4ff;
      color: #000;
      padding: 8px 14px;
      border-radius: 18px 18px 4px 18px;
      max-width: 80%;
    }
    #chat-messages .bot {
      align-self: flex-start;
      background: #ff6ec7;
      color: #fff;
      padding: 8px 14px;
      border-radius: 18px 18px 18px 4px;
      max-width: 80%;
    }
    .chat-input-row {
      display: flex;
      gap: 8px;
    }
    #chat-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 30px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      outline: none;
      font-size: 0.95rem;
    }
    #chat-input::placeholder { color: #aaa; }
    #chat-send {
      background: #00d4ff;
      border: none;
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: 700;
      color: #000;
      cursor: pointer;
      transition: 0.2s;
    }
    #chat-send:hover { background: #00b8d4; }
    /* ===== RESPONSIVE ===== */
    @media (max-width: 700px) {
      .anime-header h1 { font-size: 2.2rem; }
      .pack { width: 100%; max-width: 280px; }
      #chat-window { width: 280px; height: 380px; right: 0; }
    }
    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #ff6ec7; border-radius: 10px; }
  </style>
</head>
<body>

  <!-- ===== PARTICULES ===== -->
  <canvas id="particles-canvas"></canvas>

  <div class="container">

    <!-- ===== HEADER ===== -->
    <header class="anime-header">
      <h1>⚡ Diamant Shop ⚡</h1>
      <p>Les meilleurs prix pour Free Fire – Livraison instantanée</p>
      <span class="sub">✨ +10% bonus sur tous les packs ✨</span>
    </header>

    <!-- ===== PACKS ===== -->
    <section class="packs" id="packs-container">
      <!-- Les packs seront générés par JS pour éviter la répétition -->
    </section>

    <!-- ===== PANIER ===== -->
    <div class="cart">
      <h2>🛒 Panier</h2>
      <ul id="cart-items"></ul>
      <div class="cart-total">Total : <span id="total">0.00</span> €</div>
      <button id="checkout-btn">💳 Payer maintenant</button>
      <div id="payment-message">✅ Paiement simulé réussi ! (remplace par Stripe)</div>
    </div>

    <!-- ===== CHATBOT ===== -->
    <div class="chatbot">
      <div id="chat-window">
        <div id="chat-messages">
          <div class="bot">👋 Salut ! Je suis ton assistante. Pose-moi une question sur les diamants, les prix ou la livraison.</div>
        </div>
        <div class="chat-input-row">
          <input type="text" id="chat-input" placeholder="Écris un message..." />
          <button id="chat-send">Envoyer</button>
        </div>
      </div>
      <button id="chat-toggle">🤖 IA Assistante</button>
    </div>

  </div>

  <script>
    // ============================================================
    // 1. PARTICULES ANIME (canvas)
    // ============================================================
    (function initParticles() {
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let w, h;
      const particles = [];
      const count = 70;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() {
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.size = Math.random() * 3 + 1;
          this.speedX = (Math.random() - 0.5) * 0.8;
          this.speedY = (Math.random() - 0.5) * 0.8;
          this.opacity = Math.random() * 0.6 + 0.2;
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x < 0 || this.x > w) this.speedX *= -1;
          if (this.y < 0 || this.y > h) this.speedY *= -1;
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 110, 199, ${this.opacity})`;
          ctx.fill();
          // petite traînée
          ctx.shadowColor = '#ff6ec7';
          ctx.shadowBlur = 10;
        }
      }

      for (let i = 0; i < count; i++) particles.push(new Particle());

      function animate() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
      }
      animate();
    })();

    // ============================================================
    // 2. DONNÉES DES PACKS
    // ============================================================
    const packsData = [
      { id: 1, diamonds: 100, price: 5, bonus: 10, icon: '💎' },
      { id: 2, diamonds: 300, price: 10, bonus: 20, icon: '💎' },
      { id: 3, diamonds: 720, price: 20, bonus: 50, icon: '💎' },
      { id: 4, diamonds: 1500, price: 35, bonus: 100, icon: '💎' },
      { id: 5, diamonds: 3000, price: 60, bonus: 200, icon: '💎' }
    ];

    // ============================================================
    // 3. GÉNÉRATION DES PACKS DANS LE DOM
    // ============================================================
    const packsContainer = document.getElementById('packs-container');
    packsData.forEach(p => {
      const div = document.createElement('div');
      div.className = 'pack';
      div.dataset.price = p.price;
      div.dataset.diamonds = p.diamonds;
      div.innerHTML = `
        <span class="diamond-icon">${p.icon}</span>
        <h3>${p.diamonds} Diamants</h3>
        <div class="price">${p.price} <small>€</small></div>
        <span class="bonus">+${p.bonus} offerts</span><br>
        <button class="buy-btn">Acheter</button>
      `;
      packsContainer.appendChild(div);
    });

    // ============================================================
    // 4. PANIER (LOGIQUE)
    // ============================================================
    const cart = [];
    const cartItemsEl = document.getElementById('cart-items');
    const totalEl = document.getElementById('total');
    const checkoutBtn = document.getElementById('checkout-btn');
    const paymentMsg = document.getElementById('payment-message');

    // Ajouter au panier (clic sur "Acheter")
    document.querySelectorAll('.buy-btn').forEach((btn, index) => {
      btn.addEventListener('click', function() {
        const pack = this.closest('.pack');
        const price = parseFloat(pack.dataset.price);
        const diamonds = pack.dataset.diamonds;
        const name = pack.querySelector('h3').textContent;
        cart.push({ name, price, diamonds });
        updateCart();
        // feedback visuel
        this.textContent = '✅ Ajouté';
        setTimeout(() => { this.textContent = 'Acheter'; }, 800);
      });
    });

    function updateCart() {
      cartItemsEl.innerHTML = '';
      let total = 0;
      cart.forEach((item, index) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span>${item.name} – ${item.price} €</span>
          <button class="remove" data-index="${index}">✖</button>
        `;
        cartItemsEl.appendChild(li);
        total += item.price;
      });
      totalEl.textContent = total.toFixed(2);
      // Événements pour les boutons supprimer
      document.querySelectorAll('.remove').forEach(btn => {
        btn.addEventListener('click', function() {
          const idx = parseInt(this.dataset.index);
          cart.splice(idx, 1);
          updateCart();
        });
      });
    }

    // ============================================================
    // 5. PAIEMENT (simulé – à remplacer par Stripe)
    // ============================================================
    checkoutBtn.addEventListener('click', function() {
      if (cart.length === 0) {
        alert('🛒 Votre panier est vide.');
        return;
      }
      // Calcul du total
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      // Simulation d'un paiement (remplace par redirection Stripe)
      paymentMsg.style.display = 'block';
      paymentMsg.textContent = '⏳ Traitement en cours...';
      setTimeout(() => {
        paymentMsg.textContent = '✅ Paiement réussi ! Vos diamants seront ajoutés sous 5 min.';
        // Vider le panier
        cart.length = 0;
        updateCart();
        // Option : rediriger vers un lien Stripe réel
        // if (total === 5) window.location.href = 'https://buy.stripe.com/...';
        // etc.
      }, 2000);
    });

    // ============================================================
    // 6. CHATBOT (IA simulée + possible API)
    // ============================================================
    const chatToggle = document.getElementById('chat-toggle');
    const chatWindow = document.getElementById('chat-window');
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const chatSend = document.getElementById('chat-send');

    chatToggle.addEventListener('click', () => {
      const isOpen = chatWindow.style.display === 'flex';
      chatWindow.style.display = isOpen ? 'none' : 'flex';
    });

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = sender;
      div.textContent = text;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function handleSend() {
      const text = chatInput.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      chatInput.value = '';

      // ====== SIMULATION IA (remplace par appel API) ======
      // Pour une vraie IA, décommente et adapte :
      /*
      try {
        const response = await fetch('https://ton-api.vercel.app/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        addMessage(data.reply, 'bot');
      } catch {
        addMessage('Désolée, je suis en maintenance. Réessaie !', 'bot');
      }
      */

      // Simulation locale (réponses intelligentes)
      setTimeout(() => {
        let reply = "Je suis ton assistante virtuelle. Je peux t'aider pour les commandes, les prix ou les délais.";
        const lower = text.toLowerCase();
        if (lower.includes('prix') || lower.includes('coût') || lower.includes('tarif')) {
          reply = "Nos packs commencent à 5 € pour 100 diamants. Le pack 720 diamants est à 20 € avec 50 bonus !";
        } else if (lower.includes('livraison') || lower.includes('delai') || lower.includes('temps')) {
          reply = "La livraison est instantanée après validation du paiement (généralement 2 à 5 minutes).";
        } else if (lower.includes('bonus') || lower.includes('offert')) {
          reply = "Tous nos packs incluent des bonus ! Ex: 720 diamants + 50 offerts pour 20 €.";
        } else if (lower.includes('merci') || lower.includes('cool') || lower.includes('super')) {
          reply = "Avec plaisir ! N'hésite pas si tu as d'autres questions 😊";
        } else if (lower.includes('aide') || lower.includes('que faire')) {
          reply = "Tu peux choisir un pack, l'ajouter au panier, puis cliquer sur 'Payer maintenant'.";
        }
        addMessage(reply, 'bot');
      }, 500);
    }

    chatSend.addEventListener('click', handleSend);
    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSend();
    });

    // ============================================================
    // 7. PETIT PLUS : animation de bienvenue du chatbot
    // ============================================================
    setTimeout(() => {
      addMessage('🌟 Profite de nos offres ! Si tu as besoin d\'aide, je suis là.', 'bot');
    }, 1500);
  </script>
</body>
    </html>
