<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique Diamants | KMLS STORE</title>
    <link rel="stylesheet" href="https://cloudflare.com"/>
    <style>
        :root { --primary: #ff4500; --bg: #0b0c10; --card: #1f2833; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; text-align: center; }
        nav { background: rgba(0,0,0,0.9); padding: 15px; border-bottom: 1px solid var(--primary); }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
        .container { padding: 20px; max-width: 600px; margin: auto; }
        .diamond-card { background: var(--card); border: 2px solid var(--primary); border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 0 15px rgba(255, 69, 0, 0.3); }
        .btn-buy { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; width: 100%; cursor: pointer; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
    </style>
</head>
<body>
    <nav><a href="index.html">Accueil</a><a href="boutique.html">Boutique</a><a href="sensibilite.html">Sensibilité</a></nav>
    <div class="container animate__animated animate__fadeIn">
        <h1>💎 Boutique Diamants</h1>
        <div class="diamond-card">
            <h3>100 Diamants + Bonus</h3>
            <p>Prix : 900 FCFA</p>
            <input type="text" placeholder="Entrez votre Player ID Free Fire" required>
            <button class="btn-buy">Acheter via Mobile Money</button>
        </div>
        <div class="diamond-card">
            <h3>530 Diamants + Bonus</h3>
            <p>Prix : 4500 FCFA</p>
            <input type="text" placeholder="Entrez votre Player ID Free Fire" required>
            <button class="btn-buy">Acheter via Mobile Money</button>
        </div>
    </div>
</body>
</html>
